apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp194-api
  labels:
    app: mp194-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp194-api
  template:
    metadata:
      labels:
        app: mp194-api
    spec:
      containers:
        - name: mp194-api
          image: mp194-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
